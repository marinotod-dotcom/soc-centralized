server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /api/auth/verify {
        internal;
        proxy_pass http://vuln-api:8000/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # racine : si déjà connecté -> dashboard, sinon -> page de login (index.html)
    location = / {
        auth_request /api/auth/verify;
        error_page 401 = @serve_login;
        return 302 /action_plan;
    }

    location @serve_login {
        try_files /index.html =404;
    }

    location = /action_plan {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;
        try_files /action_plan.html =404;
    }

    location = /coverage {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;
        try_files /coverage.html =404;
    }

    location = /sla_analytics {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;
        try_files /sla_analytics.html =404;
    }

    location = /vulnerabilites {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;
        try_files /vulnerabilites.html =404;
    }

    location @redirect_login {
        return 302 /;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /data/ {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;
        proxy_pass http://minio:9000/dashboard-data/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location /docs {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;
        proxy_pass http://vuln-api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /redoc {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;
        proxy_pass http://vuln-api:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openapi.json {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;
        proxy_pass http://vuln-api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
        proxy_pass http://vuln-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}