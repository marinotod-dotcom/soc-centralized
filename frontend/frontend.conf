proxy_cache_path /var/cache/nginx/data_cache levels=1:2 keys_zone=data_cache:10m max_size=500m inactive=24h use_temp_path=off;

log_format timing '$remote_addr - [$time_local] "$request" '
                   'status=$status req_time=$request_time '
                   'upstream_time=$upstream_response_time '
                   'upstream_addr=$upstream_addr';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    access_log /var/log/nginx/access.log timing;

    # ============================================================
    # Compression
    # ============================================================

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # ============================================================
    # Vérification d'authentification
    # ============================================================

    location = /api/auth/verify {
        internal;

        proxy_pass http://vuln-api:8000/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # PAGE DE LOGIN
    # ============================================================

    location = / {
        try_files /index.html =404;
    }

    # ============================================================
    # PAGES PROTÉGÉES
    # ============================================================

    location = /action_plan {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;

        try_files /action_plan.html =404;
    }

    location = /coverage {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;

        try_files /coverage.html =404;
    }

    location = /sla_analytics {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;

        try_files /sla_analytics.html =404;
    }

    location = /vulnerabilites {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;

        try_files /vulnerabilites.html =404;
    }

    # ============================================================
    # REDIRECTION VERS LOGIN
    # ============================================================

    location @redirect_login {
        return 302 /;
    }

    # ============================================================
    # ASSETS
    # ============================================================

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ============================================================
    # DATA
    # ============================================================

    location /data/ {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;

        proxy_pass http://minio:9000/dashboard-data/;

        proxy_cache data_cache;
        proxy_cache_valid 200 6h;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_buffer_size 256k;
        proxy_max_temp_file_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        add_header Cache-Control "public, max-age=21600";
    }

    # ============================================================
    # API — VULNERABILITIES (cache court, contournable)
    # ============================================================

    location = /api/vulnerabilities {
        proxy_pass http://vuln-api:8000/api/vulnerabilities;

        proxy_cache data_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_key $uri$http_cookie;
        proxy_cache_bypass $http_x_force_refresh;
        proxy_no_cache $http_x_force_refresh;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_buffer_size 256k;
        proxy_max_temp_file_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # ============================================================
    # DOCUMENTATION API
    # ============================================================

    location /docs {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;

        proxy_pass http://vuln-api:8000/docs;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /redoc {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;

        proxy_pass http://vuln-api:8000/redoc;

        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openapi.json {
        auth_request /api/auth/verify;
        error_page 401 = @redirect_login;

        proxy_pass http://vuln-api:8000/openapi.json;

        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # ============================================================
    # API
    # ============================================================

    location /api/ {
        proxy_pass http://vuln-api:8000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location ~ ^/api/vulnerabilities/by-cve/ {
        proxy_pass http://vuln-api:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
} 
