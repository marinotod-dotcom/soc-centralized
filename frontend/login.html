<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — SmartOne.ai</title>
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="nav-brand" style="justify-content:center; margin-bottom:24px;">
      <img class="logo" src="/assets/Q1e6wb5hCU58sRKYk2GGndhxJPw.png" alt="logoSmartOne">
      <span class="brand-name">SmartOne.ai</span>
    </div>

    <h1 style="text-align:center; font-size:20px; margin-bottom:4px;">Connexion</h1>
    <div class="subtitle" style="text-align:center; margin-bottom:24px;">
      Accès au tableau de bord des vulnérabilités
    </div>

    <div class="error-msg" id="loginError" style="display:none;"></div>

    <form id="loginForm" autocomplete="on">
      <label for="email">Identifiant</label>
      <input type="email" id="email" name="email" autocomplete="username" required>

      <label for="password" style="margin-top:12px;">Mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" id="loginBtn" style="margin-top:20px; width:100%;">Se connecter</button>
    </form>
  </div>
</div>

<script type="module" src="/src/pages/login.js"></script>
</body>
</html>
