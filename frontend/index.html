<!-- index.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Suivi des vulnérabilités</title>
<link rel="stylesheet" href="/src/shared/theme.css">
</head>
<body class="login-page">

<div class="login-wrap">
  <form id="loginForm" class="login-card">
    <div class="boxLogo">
      <img src="/assets/Q1e6wb5hCU58sRKYk2GGndhxJPw.png" alt="logo" class="idLogo">
    </div>
    <h1>Suivi des vulnérabilités</h1>
    <div class="subtitle">Connectez-vous pour accéder au tableau de bord</div>

    <label for="email">Identifiant</label>
    <input id="email" name="email" type="text" autocomplete="username" required />

    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <div class="error-msg" id="loginError" style="display:none;"></div>

    <button type="submit" id="loginBtn">Se connecter</button>
  </form>
</div>

<script type="module" src="/src/pages/login.js"></script>
</body>
</html>
