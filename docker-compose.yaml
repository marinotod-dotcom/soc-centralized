services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: wazuh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: wazuh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/dashboard-data &&
      mc anonymous set download local/dashboard-data
      "
    restart: "no"

  postgres:
    image: postgres:16.14-alpine3.23
    container_name: wazuh-vuln-db
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vuln_tracking}
      POSTGRES_USER: ${POSTGRES_USER:-vuln_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vuln_app} -d ${POSTGRES_DB:-vuln_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vuln-api:
    build: ./backend
    container_name: wazuh-vuln-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  wazuh-report:
    build: ./backend
    container_name: wazuh-report-weekly
    env_file: [.env]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DASHBOARD: dashboard-data
    command: python main.py --only all
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/main.py:/app/main.py
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  frontend-web:
    build: ./frontend
    container_name: wazuh-frontend-web
    ports:
      - "8088:80"
    depends_on: [minio, vuln-api]
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  minio-data: